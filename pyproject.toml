[project]
name = "tripwire"
version = "0.1.0"
description = "Document field extraction with calibrated confidence and conformal risk control."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "data", "extract", "confidence", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
